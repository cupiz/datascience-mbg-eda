services:
  plateguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plateguard-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  plateguard-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plateguard-dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - PLATEGUARD_API_URL=http://plateguard-api:8000
    depends_on:
      plateguard-api:
        condition: service_healthy
    restart: unless-stopped
